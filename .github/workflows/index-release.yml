name: Build & publish index

# Builds a search index from a Chrono checkout, gates it on the retrieval eval,
# and publishes it as a GitHub Release whose assets `chrono-rag get-index`
# downloads. Two channels:
#   main    - dated snapshot of Chrono's development branch (monthly, default)
#   <tag>   - a Chrono release such as 10.0.0 (what conda PyChrono users run)
# Asset naming is the contract with cli.py:_find_release_asset:
#   chrono-rag-index-<channel>-<suffix>.zip (+ .sha256)
on:
  schedule:
    - cron: "0 6 1 * *"          # monthly, 1st at 06:00 UTC: refresh the main snapshot
  workflow_dispatch:
    inputs:
      chrono_ref:
        description: "Chrono git ref to index (branch or release tag)"
        default: "main"

permissions:
  contents: write                # create the release and upload assets

concurrency:
  group: index-release
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHRONO_REF: ${{ github.event.inputs.chrono_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable)
        run: pip install -e ".[dev]"

      - name: Clone Chrono (${{ env.CHRONO_REF }})
        run: |
          git clone --depth 1 --branch "$CHRONO_REF" \
            https://github.com/projectchrono/chrono.git chrono-src

      # Channel + names. A release tag (10.0.0) is its own channel; anything else
      # is the "main" channel and carries the snapshot date in tag and asset.
      - name: Derive channel and asset names
        id: names
        run: |
          SHORT_SHA=$(git -C chrono-src rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y-%m-%d)
          if [[ "$CHRONO_REF" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            CHANNEL="${CHRONO_REF#v}"
            TAG="index-${CHANNEL}-${SHORT_SHA}"
            ASSET="chrono-rag-index-${CHANNEL}-${SHORT_SHA}.zip"
          else
            CHANNEL="main"
            TAG="index-main-${DATE}"
            ASSET="chrono-rag-index-main-${DATE}-${SHORT_SHA}.zip"
          fi
          {
            echo "short_sha=$SHORT_SHA"; echo "date=$DATE"; echo "channel=$CHANNEL"
            echo "tag=$TAG"; echo "asset=$ASSET"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL tag=$TAG asset=$ASSET"

      # Skip a scheduled run when the newest release of this channel already
      # indexed this exact Chrono commit (nothing new to publish).
      - name: Skip if this Chrono commit is already published
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CH="${{ steps.names.outputs.channel }}"
          SHA="${{ steps.names.outputs.short_sha }}"
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,assets \
               --jq ".[] | select(.tagName | startswith(\"index-${CH}-\")) | .assets[].name" 2>/dev/null \
             | grep -q -- "-${SHA}\.zip$"; then
            echo "already published for ${CH} @ ${SHA}; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build index
        if: steps.skip.outputs.skip != 'true'
        env:
          CHRONO_RAG_REPO: chrono-src
          CHRONO_RAG_INDEX: index
          CHRONO_RAG_REF: ${{ env.CHRONO_REF }}
        run: python -m chrono_rag.preprocess.build_index

      - name: Retrieval eval gate
        if: steps.skip.outputs.skip != 'true'
        env:
          CHRONO_RAG_INDEX: index
        run: python -m chrono_rag.eval.run_eval | tee eval.txt   # non-zero exit fails the build

      - name: Package index (zip + sha256)
        if: steps.skip.outputs.skip != 'true'
        run: |
          ASSET="${{ steps.names.outputs.asset }}"
          python -c "import shutil; shutil.make_archive('${ASSET%.zip}', 'zip', '.', 'index')"
          sha256sum "$ASSET" > "$ASSET.sha256"
          ls -la "$ASSET" "$ASSET.sha256"
          {
            echo "Prebuilt chrono-rag search index, channel **${{ steps.names.outputs.channel }}**."
            echo
            echo "- Chrono ref: \`$CHRONO_REF\` @ \`$(git -C chrono-src rev-parse HEAD)\`"
            echo "- Built: ${{ steps.names.outputs.date }} (UTC), chrono-rag @ \`${GITHUB_SHA::9}\`"
            echo "- Manifest: \`$(python -c "import json; m=json.load(open('index/manifest.json')); print(m['version_label'], '|', m['n_chunks'], 'chunks from', m['n_files'], 'files |', m['model'])")\`"
            echo
            echo "Install with \`chrono-rag get-index --channel ${{ steps.names.outputs.channel }}\`."
            echo
            echo "<details><summary>Retrieval eval</summary>"; echo; echo '```'; cat eval.txt; echo '```'; echo "</details>"
          } > release_notes.md

      - uses: actions/upload-artifact@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          name: chrono-rag-index-${{ steps.names.outputs.channel }}
          path: |
            ${{ steps.names.outputs.asset }}
            ${{ steps.names.outputs.asset }}.sha256

      - name: Publish release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.names.outputs.tag }}
          name: Index ${{ steps.names.outputs.channel }} (${{ steps.names.outputs.date }})
          body_path: release_notes.md
          files: |
            ${{ steps.names.outputs.asset }}
            ${{ steps.names.outputs.asset }}.sha256
