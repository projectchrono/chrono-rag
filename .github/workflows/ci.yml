name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, all extras)
        run: pip install -e ".[llm,web,mcp,dev]"
      - name: Unit tests
        run: pytest -q
