name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, all extras)
        run: pip install -e ".[llm,web,mcp,dev]"
      - name: Unit tests (latest mcp, 2.x)
        run: pytest -q
      # The MCP server must import on both SDK majors (mcp_server.py has an
      # import shim). The default install above resolves to 2.x; this re-checks 1.x.
      - name: MCP server imports on mcp 1.x
        run: |
          pip install "mcp<2"
          python -c "import chrono_rag.surfaces.mcp_server as s; print(type(s.mcp).__name__)"
          pytest -q -k mcp_server
